apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-app
  namespace: poc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flask-app
  template:
    metadata:
      labels:
        app: flask-app
    spec:
      containers:
      - name: flask
        image: flaskAppRegistory.azurecr.io/flask-app:1156999980
        ports:
        - containerPort: 5000
        volumeMounts:
        - mountPath: /data
          name: app-storage
      volumes:
      - name: app-storage
        persistentVolumeClaim:
          claimName: azurefile-pvc